<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cubepath API</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #111;
        --bg: #fafafa;
        --muted: #666;
        --border: #ddd;
        --accent: #222;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #eee;
          --bg: #121212;
          --muted: #999;
          --border: #333;
          --accent: #fff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.5;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.25rem;
      }
      p.lead {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      label {
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      textarea {
        width: 100%;
        min-height: 5rem;
        padding: 0.65rem 0.75rem;
        font: inherit;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        resize: vertical;
      }
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-top: 0.75rem;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        padding: 0.45rem 1rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--fg);
        color: var(--bg);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        background: transparent;
        color: var(--fg);
      }
      .out {
        margin-top: 1.5rem;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        min-height: 4rem;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.95rem;
      }
      .out:empty::before {
        content: "La respuesta aparecerá aquí en streaming…";
        color: var(--muted);
      }
      .meta {
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 1rem;
      }
      .meta code {
        font-size: 0.85em;
      }
      .err {
        color: #c00;
      }
      @media (prefers-color-scheme: dark) {
        .err {
          color: #f66;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cubepath API</h1>
      <p class="lead">Prueba <code>POST /chat</code> con respuesta en streaming (SSE).</p>
      <p class="meta" id="health">Comprobando <code>/health</code>…</p>
      <label for="msg">Mensaje</label>
      <textarea id="msg" placeholder="Escribe tu mensaje…"></textarea>
      <div class="row">
        <button type="button" id="send">Enviar</button>
        <button type="button" id="clear" class="secondary">Limpiar</button>
      </div>
      <div class="out" id="out" aria-live="polite"></div>
    </main>
    <script>
      const healthEl = document.getElementById("health");
      const msgEl = document.getElementById("msg");
      const outEl = document.getElementById("out");
      const sendBtn = document.getElementById("send");
      const clearBtn = document.getElementById("clear");

      fetch("/health")
        .then((r) => r.json())
        .then((j) => {
          healthEl.textContent = "/health → " + JSON.stringify(j);
        })
        .catch(() => {
          healthEl.innerHTML =
            '<span class="err">No se pudo contactar /health. ¿Está el servidor en marcha?</span>';
        });

      function parseSseBlocks(text) {
        const blocks = text.split(/\n\n+/);
        const events = [];
        for (const block of blocks) {
          const lines = block.split("\n").filter(Boolean);
          let ev = "message";
          let data = "";
          for (const line of lines) {
            if (line.startsWith("event:")) ev = line.slice(6).trim();
            else if (line.startsWith("data:")) data = line.slice(5).trim();
          }
          if (data) events.push({ event: ev, data });
        }
        return events;
      }

      async function streamChat() {
        const message = msgEl.value.trim();
        if (!message) {
          outEl.innerHTML = '<span class="err">Escribe un mensaje.</span>';
          return;
        }

        outEl.textContent = "";
        sendBtn.disabled = true;

        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message }),
          });

          const ct = res.headers.get("content-type") || "";

          if (!res.ok) {
            if (ct.includes("application/json")) {
              const j = await res.json();
              outEl.innerHTML =
                '<span class="err">' +
                (j.error ? String(j.error) : JSON.stringify(j)) +
                "</span>";
            } else {
              outEl.textContent = await res.text();
            }
            return;
          }

          if (!res.body) {
            outEl.textContent = await res.text();
            return;
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const parts = buffer.split(/\n\n/);
            buffer = parts.pop() ?? "";

            for (const chunk of parts) {
              if (!chunk.trim()) continue;
              const events = parseSseBlocks(chunk + "\n\n");
              for (const { event, data } of events) {
                if (event === "token") {
                  try {
                    const j = JSON.parse(data);
                    if (j.content) outEl.textContent += j.content;
                  } catch (_) {}
                } else if (event === "error") {
                  try {
                    const j = JSON.parse(data);
                    outEl.textContent += "\n[error] " + (j.message || data);
                  } catch (_) {
                    outEl.textContent += "\n[error] " + data;
                  }
                }
              }
            }
          }

          if (buffer.trim()) {
            const events = parseSseBlocks(buffer);
            for (const { event, data } of events) {
              if (event === "token") {
                try {
                  const j = JSON.parse(data);
                  if (j.content) outEl.textContent += j.content;
                } catch (_) {}
              }
            }
          }
        } catch (e) {
          outEl.innerHTML =
            '<span class="err">' +
            (e instanceof Error ? e.message : "Error de red") +
            "</span>";
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener("click", streamChat);
      clearBtn.addEventListener("click", () => {
        outEl.textContent = "";
        msgEl.value = "";
        msgEl.focus();
      });
      msgEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          streamChat();
        }
      });
    </script>
  </body>
</html>
