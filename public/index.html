<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cubepath API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #131314;
      --surface: #1e1f20;
      --surface-hover: #333538;
      --text: #e3e3e3;
      --text-muted: #a8a8bb;
      --accent: #a8c7fa;
      --font: 'Outfit', system-ui, sans-serif;
    }
    
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 15vh;
      overflow-x: hidden;
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 860px;
      padding: 0 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Header */
    .header {
      width: 100%;
      text-align: left;
      margin-bottom: 0.5rem;
      animation: fade-in-up 0.8s ease-out;
    }
    .greeting {
      font-size: 3.2rem;
      font-weight: 500;
      margin: 0;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    .greeting .name {
      background: linear-gradient(90deg, #c384e5, #fc97a0, #fac898);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }
    .greeting .question {
      color: #c4c7c5;
    }

    /* Input Box */
    .input-wrapper {
      width: 100%;
      background: var(--surface);
      border-radius: 32px;
      padding: 1.2rem 1.5rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.03);
      transition: all 0.3s ease;
      animation: fade-in-up 1s ease-out;
      position: relative;
    }
    .input-wrapper:focus-within {
      background: #242528;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      transform: translateY(-2px);
    }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 1.1rem;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 200px;
      line-height: 1.5;
      padding: 0;
    }
    textarea::placeholder {
      color: var(--text-muted);
    }

    .input-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .actions-group {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
    }
    .icon-btn:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    .text-btn {
      padding: 0.5rem 1rem;
      border-radius: 30px;
      gap: 0.5rem;
    }
    .text-btn:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    .provider-select {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 0.4rem 0.8rem;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      transition: all 0.2s ease;
    }
    .provider-select:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }
    .provider-select option {
      background: var(--surface);
      color: var(--text);
    }

    .send-btn {
      background: var(--text);
      color: var(--bg);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
      width: 40px;
      height: 40px;
      margin-left: 0.5rem;
      border-radius: 50%;
    }
    .send-btn.active {
      opacity: 1;
      pointer-events: all;
      transform: scale(1);
    }
    .send-btn:hover {
      background: var(--text);
      opacity: 0.9;
      transform: scale(1.05);
    }
    .send-btn svg {
      fill: var(--bg);
      width: 18px;
      height: 18px;
    }

    /* Pills */
    .pills-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      width: 100%;
      animation: fade-in-up 1.2s ease-out;
    }
    .pills-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .pill {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.03);
      border-radius: 20px;
      padding: 0.8rem 1.4rem;
      color: var(--text);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transform: translateY(0);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .pill:hover {
      background: var(--surface-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }
    .pill-emoji {
      font-size: 1.2rem;
    }

    /* Chat Output Area */
    .chat-area {
      width: 100%;
      max-width: 860px;
      display: none;
      flex-direction: column;
      gap: 2rem;
      margin-top: 1rem;
      padding: 0 2rem;
      padding-bottom: 120px; /* Space for fixed input */
    }
    .chat-area.visible {
      display: flex;
      animation: fade-in 0.5s ease;
    }
    .message {
      display: flex;
      line-height: 1.6;
      font-size: 1.05rem;
      max-width: 85%;
    }
    .message.user {
      align-self: flex-end;
      background: var(--surface);
      padding: 1rem 1.5rem;
      border-radius: 24px 24px 4px 24px;
    }
    .message.bot {
      align-self: flex-start;
      background: transparent;
      padding: 0.5rem 0;
      white-space: pre-wrap;
      width: 100%;
      max-width: 100%;
    }

    .health-status {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      opacity: 0.5;
      transition: opacity 0.3s ease;
    }
    .health-status:hover {
      opacity: 1;
    }
    .health-status.err {
      color: #f66;
      opacity: 1;
    }

    /* State classes */
    .chat-active-layout {
      justify-content: flex-start;
      padding-top: 2rem;
    }
    .fixed-input {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      background: var(--bg);
      z-index: 10;
    }

    /* Animations */
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* SVGs */
    svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="health-status" id="health">Comprobando API /health...</div>

  <main id="main-view">
    <div class="header" id="header">
      <h1 class="greeting">
        <span class="name">Hola, Alexis Britte</span><br>
        <span class="question">¿Por dónde empezamos?</span>
      </h1>
    </div>

    <!-- Wrapping the input to allow fixed positioning later -->
    <div id="input-container" style="width: 100%;">
      <div class="input-wrapper">
        <textarea id="msg" placeholder="Escribe tu mensaje..."></textarea>
        <div class="input-actions" style="justify-content: flex-end;">
          <div class="actions-group">
            <select id="provider-select" class="provider-select" title="Seleccionar LLM">
              <option value="Auto">Auto (Round Robin)</option>
              <option value="OpenRouter">OpenRouter</option>
              <option value="Groq">Groq</option>
              <option value="Cerebras">Cerebras</option>
            </select>
            <button class="icon-btn send-btn" id="sendBtn" title="Enviar">
              <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>



  </main>

  <div class="chat-area" id="chat-area">
    <!-- Chat log will appear here -->
  </div>

  <script>
    // System Health Check
    const healthEl = document.getElementById("health");
    fetch("/health")
      .then(r => r.json())
      .then(j => { healthEl.textContent = "API: Conectada"; })
      .catch(() => { healthEl.textContent = "API: Offline / Error"; healthEl.classList.add("err"); });

    // UI Elements
    const msgEl = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");
    const header = document.getElementById("header");
    // Pills logic removed
    const chatArea = document.getElementById("chat-area");
    const inputContainer = document.getElementById("input-container");
    const mainView = document.getElementById("main-view");

    // Auto-resize textarea
    msgEl.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = (this.scrollHeight) + "px";
      
      if(this.value.trim().length > 0) {
        sendBtn.classList.add("active");
      } else {
        sendBtn.classList.remove("active");
        this.style.height = "48px"; // reset
      }
    });

    // Helper to parse SSE blocks maintaining previous logic
    function parseSseBlocks(text) {
      const blocks = text.split(/\n\n+/);
      const events = [];
      for (const block of blocks) {
        const lines = block.split("\n").filter(Boolean);
        let ev = "message";
        let data = "";
        for (const line of lines) {
          if (line.startsWith("event:")) ev = line.slice(6).trim();
          else if (line.startsWith("data:")) data = line.slice(5).trim();
        }
        if (data) events.push({ event: ev, data });
      }
      return events;
    }

    async function streamChat() {
      const message = msgEl.value.trim();
      const provider = document.getElementById("provider-select").value;
      if (!message) return;

      // Switch to Chat Layout
      document.body.classList.add('chat-active-layout');
      header.style.display = 'none';
      // pills.style.display = 'none';
      inputContainer.classList.add('fixed-input');
      mainView.style.padding = '0';
      chatArea.classList.add('visible');
      
      // Append user message
      const userMsgDiv = document.createElement("div");
      userMsgDiv.className = "message user";
      userMsgDiv.textContent = message;
      chatArea.appendChild(userMsgDiv);

      // Append bot message container
      const botMsgDiv = document.createElement("div");
      botMsgDiv.className = "message bot";
      botMsgDiv.innerHTML = '<span style="color:#666">Pensando...</span>';
      chatArea.appendChild(botMsgDiv);

      // Scroll to bottom
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

      // Reset input
      msgEl.value = "";
      msgEl.style.height = "48px";
      sendBtn.classList.remove("active");
      sendBtn.disabled = true;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, provider }),
        });

        botMsgDiv.textContent = ""; // Clear 'Pensando...'

        if (!res.ok) {
           const ct = res.headers.get("content-type") || "";
           if (ct.includes("application/json")) {
             const j = await res.json();
             botMsgDiv.innerHTML = '<span style="color:#f66">' + (j.error ? String(j.error) : JSON.stringify(j)) + "</span>";
           } else {
             botMsgDiv.textContent = await res.text();
           }
           return;
        }

        if (!res.body) {
          botMsgDiv.textContent = await res.text();
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const parts = buffer.split(/\n\n/);
          buffer = parts.pop() ?? "";

          for (const chunk of parts) {
            if (!chunk.trim()) continue;
            const events = parseSseBlocks(chunk + "\n\n");
            for (const { event, data } of events) {
              if (event === "token") {
                try {
                  const j = JSON.parse(data);
                  if (j.content) botMsgDiv.textContent += j.content;
                } catch (_) {}
              } else if (event === "error") {
                try {
                  const j = JSON.parse(data);
                  botMsgDiv.textContent += "\n[error] " + (j.message || data);
                } catch (_) {
                  botMsgDiv.textContent += "\n[error] " + data;
                }
              }
            }
          }
          // Scroll as content streams
          window.scrollTo({ top: document.body.scrollHeight });
        }

        if (buffer.trim()) {
          const events = parseSseBlocks(buffer);
          for (const { event, data } of events) {
            if (event === "token") {
              try {
                const j = JSON.parse(data);
                if (j.content) botMsgDiv.textContent += j.content;
              } catch (_) {}
            }
          }
        }
      } catch (e) {
        botMsgDiv.innerHTML = '<span style="color:#f66">Error: ' + (e instanceof Error ? e.message : "Error de red") + '</span>';
      } finally {
        sendBtn.disabled = false;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    }

    sendBtn.addEventListener("click", streamChat);

    msgEl.addEventListener("keydown", (e) => {
      // Send on Enter without shift
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        streamChat();
      }
    });

    // Make pills clickable to populate input and autofocus logic removed
  </script>
</body>
</html>
